{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Địa Danh Lịch Sử & Thiên Nhiên</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
       crossorigin=""/>
       
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
       crossorigin=""></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js" charset="utf-8"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        #map { 
            height: 600px; /* Chiều cao cố định cho bản đồ */
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .popup-image {
            max-width: 100px; 
            height: auto;
            margin-top: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🗺️ Bản đồ Địa Danh Lịch Sử & Thiên Nhiên</h1>
        
        <div id="map"></div> </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var mapContainer = document.getElementById('map');
            if (!mapContainer) {
                console.error("Lỗi: Không tìm thấy container bản đồ với ID 'map'.");
                return;
            }
            
            // Khởi tạo Bản đồ Leaflet
            var map = L.map('map').setView([16.0, 108.0], 6);

            // --- THÊM MỚI: Nút Vị trí của tôi ---
            L.control.locate({
                position: 'topleft',  // Vị trí nút (góc trên trái)
                strings: {
                    title: "Cho tôi biết tôi đang ở đâu" // Chú thích khi rê chuột vào
                },
                locateOptions: {
                    enableHighAccuracy: true // Cố gắng lấy vị trí chính xác nhất (GPS)
                }
            }).addTo(map);

            // Thêm Tile Layer (OpenStreetMap)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
            }).addTo(map);

            // Gọi API để lấy dữ liệu tọa độ từ Django
            // ... (Phần khởi tạo map và tileLayer giữ nguyên) ...

    // 1. Tạo một nhóm Cluster (Thay đổi quan trọng)
    var markers = L.markerClusterGroup();

    // Gọi API để lấy dữ liệu tọa độ từ Django
    fetch('/api/locations/')
        .then(response => response.json())
        .then(data => {
            if (data.length === 0) {
                console.warn("API trả về dữ liệu rỗng.");
            }
            data.forEach(diadiem => {
                // Đảm bảo tọa độ là số
                const lat = parseFloat(diadiem.vido);
                const lng = parseFloat(diadiem.kinhdo);

                if (!isNaN(lat) && !isNaN(lng)) {
                    const imageUrl = diadiem.hinh_anh_dai_dien ? diadiem.hinh_anh_dai_dien : '';
                    
                    const popupContent = `
                        <h4>${diadiem.ten}</h4>
                        <p><b>Phân loại:</b> ${diadiem.loai}</p>
                        ${imageUrl ? `<img src="${imageUrl}" class="popup-image">` : ''}<br>
                        <a href="/diadiem/${diadiem.id}">Xem chi tiết</a>
                    `;
                    
                    // 2. Tạo marker nhưng KHÔNG thêm trực tiếp vào map (Bỏ .addTo(map))
                    var marker = L.marker([lat, lng]).bindPopup(popupContent);

                    // 3. Thêm marker vào nhóm Cluster
                    markers.addLayer(marker);
                }
            });

            // 4. Cuối cùng, thêm nhóm Cluster vào bản đồ
            map.addLayer(markers);
        })
        .catch(error => console.error('Lỗi khi tải dữ liệu địa điểm:', error));
        }); 
    </script>
</body>
</html>
